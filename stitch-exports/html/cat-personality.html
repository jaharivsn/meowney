<script>
    function selectPersonality(element) {
      // Remove active classes from all cards
      document.querySelectorAll('.personality-card').forEach(card => {
        card.classList.remove('ring-sakura-pink', 'bg-white', 'shadow-xl');
        card.classList.add('bg-cream-milk', 'shadow-sm');
        card.querySelector('span.material-symbols-outlined').classList.add('opacity-0');
        card.querySelector('span.material-symbols-outlined').classList.remove('opacity-100');
      });

      // Add active classes to selected card
      element.classList.remove('bg-cream-milk', 'shadow-sm');
      element.classList.add('ring-sakura-pink', 'bg-white', 'shadow-xl');
      const check = element.querySelector('span.material-symbols-outlined');
      check.classList.remove('opacity-0');
      check.classList.add('opacity-100');

      // Add a little paw-click animation
      const ripple = document.createElement('div');
      ripple.className = 'absolute pointer-events-none text-sakura-pink/20';
      ripple.innerHTML = '<span class="material-symbols-outlined" style="font-size: 48px">pets</span>';
      ripple.style.left = '50%';
      ripple.style.top = '50%';
      ripple.style.transform = 'translate(-50%, -50%) scale(0)';
      ripple.style.transition = 'all 0.4s ease-out';
      element.style.position = 'relative';
      element.appendChild(ripple);
      
      setTimeout(() => {
        ripple.style.transform = 'translate(-50%, -50%) scale(2)';
        ripple.style.opacity = '0';
      }, 10);
      
      setTimeout(() => ripple.remove(), 400);
    }

    function handleSave() {
      const btn = document.getElementById('save-button');
      const ripple = document.getElementById('btn-ripple');
      
      ripple.classList.add('scale-[3]');
      btn.innerHTML = 'Saved! <span class="material-symbols-outlined">favorite</span>';
      
      setTimeout(() => {
        ripple.classList.remove('scale-[3]');
        btn.innerHTML = 'Set My Companion <span class="material-symbols-outlined">pets</span>';
      }, 1500);
    }

    // Initialize the first one as selected
    window.addEventListener('load', () => {
      selectPersonality(document.querySelector('.personality-card'));
    });

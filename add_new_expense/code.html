<script>
  function createPawBurst(event) {
    const container = document.getElementById('particle-container');
    const rect = event.currentTarget.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // Remove active state from other cards
    document.querySelectorAll('.category-card').forEach(card => {
      card.classList.remove('ring-2', 'ring-sakura-pink');
    });
    event.currentTarget.classList.add('ring-2', 'ring-sakura-pink');

    for (let i = 0; i < 6; i++) {
      const particle = document.createElement('span');
      particle.className = 'material-symbols-outlined absolute text-sakura-pink/60 transition-all pointer-events-none';
      particle.style.fontSize = '24px';
      particle.innerText = 'pets';
      
      const angle = (i / 6) * Math.PI * 2;
      const velocity = 80 + Math.random() * 40;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;
      
      particle.style.left = `${centerX - 12}px`;
      particle.style.top = `${centerY - 12}px`;
      
      container.appendChild(particle);

      const animation = particle.animate([
        { transform: 'translate(0, 0) scale(0.5) rotate(0deg)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(1.2) rotate(${Math.random() * 90}deg)`, opacity: 0 }
      ], {
        duration: 800,
        easing: 'cubic-bezier(0.2, 1, 0.3, 1)'
      });

      animation.onfinish = () => particle.remove();
    }
  }

  // Handle Amount Input Scaling
  const amountInput = document.querySelector('input[type="number"]');
  amountInput.addEventListener('input', (e) => {
    const length = e.target.value.length || 1;
    const baseSize = 48;
    const newSize = Math.max(32, baseSize - (length * 2));
    e.target.style.fontSize = `${newSize}px`;
  });
</script></main><nav class="fixed bottom-4 inset-x-margin-mobile z-50 pb-safe" data-active-classes="bg-sakura-pink text-primary shadow-inner"><div class="bg-surface/90 backdrop-blur-xl rounded-xl flex justify-around items-center h-16 shadow-[0_4px_20px_rgba(0,0,0,0.06)] px-2"><a class="flex flex-col items-center justify-center w-14 h-12 rounded-lg text-on-surface-variant transition-all hover:scale-105 active:scale-95" data-path="dashboard" href="#"><span class="material-symbols-outlined">pets</span><span class="font-label-sm text-label-sm">Home</span></a><a aria-current="page" class="flex flex-col items-center justify-center w-14 h-12 rounded-lg transition-all hover:scale-105 active:scale-95 bg-sakura-pink text-primary shadow-inner" data-path="expenses" href="#"><span class="material-symbols-outlined">receipt_long</span><span class="font-label-sm text-label-sm">Bills</span></a><a class="flex flex-col items-center justify-center w-14 h-12 rounded-lg text-on-surface-variant transition-all hover:scale-105 active:scale-95" data-path="goals" href="#"><span class="material-symbols-outlined">stars</span><span class="font-label-sm text-label-sm">Goals</span></a><a class="flex flex-col items-center justify-center w-14 h-12 rounded-lg text-on-surface-variant transition-all hover:scale-105 active:scale-95" data-path="profile" href="#"><span class="material-symbols-outlined">account_circle</span><span class="font-label-sm text-label-sm">Profile</span></a></div></nav></body></html>
